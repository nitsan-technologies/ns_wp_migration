imports:
  - { resource: "EXT:rte_ckeditor/Configuration/RTE/Processing.yaml" }
  - { resource: "EXT:rte_ckeditor/Configuration/RTE/Editor/Base.yaml" }
  - { resource: "EXT:rte_ckeditor/Configuration/RTE/Editor/Plugins.yaml" }
  - { resource: "EXT:rte_ckeditor_image/Configuration/RTE/Plugin.yaml" }

editor:
  config:
    toolbar:
      items:
        - Image
        - clipboard
        - removeFormat
        - undo
        - redo
        - '|'
        - find
        - selectAll
        - '|'
        - link
        - insertTable
        - tableColumn
        - tableRow
        - mergeTableCells
        - '|'
        - sourceEditing
        - showBlocks
        - horizontalLine
        - '-'
        - bold
        - italic
        - underline
        - strikethrough
        - subscript
        - superscript
        - softhyphen
        - '|'
        - bulletedList
        - numberedList
        - blockQuote
        - indent
        - outdent
        - alignment
        - '|'
        - specialCharacters
        - '-'
        - style
        - heading

    format_tags: "p;h1;h2;h3;h4;h5;pre"

    justifyClasses:
      - text-left
      - text-center
      - text-right
      - text-justify

    extraPlugins:
      - justify

    removeButtons:
      - Anchor

    htmlSupport:
      allow:
        - name: 'img'
          attributes: true
          classes: true
          styles: true
        - name: 'figure'
          attributes: true
          classes: true
          styles: true

processing:
  allowTags:
    - img
    - figure

  HTMLparser_db:
    tags:
      img:
        allowedAttribs: class,src,alt,width,height
        fixAttrib:
          src:
            userFunc: null
      figure:
        allowedAttribs: class